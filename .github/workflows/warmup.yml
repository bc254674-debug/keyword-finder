name: Vercel Warmup

on:
  schedule:
    - cron: "*/7 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping website
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://www.keywordfind.asia/")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Unexpected status: $STATUS"
          fi
